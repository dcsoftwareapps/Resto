name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            solution: Resto.sln
          - os: ubuntu-latest
            solution: Resto.Portable.slnf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Windows and Android workloads
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows maui-android
      - name: Install Android SDK dependencies
        if: runner.os == 'Windows'
        run: dotnet build src/Resto.App/Resto.App.csproj -t:InstallAndroidDependencies -f net10.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME_17_X64" -p:AcceptAndroidSDKLicenses=true
      - name: Build Windows and Android solution
        if: runner.os == 'Windows'
        run: dotnet build Resto.sln "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME_17_X64"
      - name: Build portable projects
        if: runner.os == 'Linux'
        run: dotnet build Resto.Portable.slnf
      - name: Run tests
        run: dotnet test ${{ matrix.solution }} --no-build

  build-ios:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install iOS and Android workloads
        run: dotnet workload install maui-ios maui-android
      - name: Compile for the iOS simulator
        run: dotnet build src/Resto.App/Resto.App.csproj -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
