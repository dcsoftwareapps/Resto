<title>Resto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de demo arriba con conmutador de superficies; escritorio = ventana con riel marino + área de trabajo; celulares en marco con panel "en vivo"; cocina = pantalla oscura a lo ancho */
:root{
  --navy:#1B2B3F; --navy-2:#2A4160; --on-navy:#FFFFFF;
  --copper:#B8713A; --copper-ink:#8E5226; --copper-soft:#F4E7DB; --on-copper:#FFFFFF;
  --bg:#F6F4F0; --surface:#FFFFFF; --surface-2:#FAF8F4; --line:#E4DED5; --line-2:#EFEBE4;
  --fg:#1B2433; --muted:#68707C; --faint:#9AA0A9;
  --ok:#2E7D5B; --ok-soft:#E2F0E8; --warn:#9A6512; --warn-soft:#FAEFD9; --bad:#C0392B; --bad-soft:#F8E2DE;
  --rail:#1B2B3F; --rail-fg:#B9C5D3; --rail-hover:#24384F; --bar:#2A4160;
  --shadow:0 1px 2px rgba(27,43,63,.06),0 10px 30px rgba(27,43,63,.10);
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Schibsted Grotesk','Instrument Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --k-bg:#0E141B; --k-card:#18212C; --k-line:#2A3644; --k-fg:#EEF1F4; --k-muted:#93A0AE;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#2C4766; --navy-2:#3A5A80; --copper:#D08A52; --copper-ink:#E8A877; --copper-soft:#3A2A1D;
  --bg:#0F151D; --surface:#17202B; --surface-2:#1C2733; --line:#2B3746; --line-2:#222D3A;
  --fg:#E8E4DD; --muted:#9AA3AF; --faint:#6E7884;
  --ok:#55B387; --ok-soft:#163226; --warn:#E3AA45; --warn-soft:#3A2D14; --bad:#E5705F; --bad-soft:#3D1E1A;
  --rail:#0B1118; --rail-fg:#A9B5C3; --rail-hover:#16212E; --bar:#5B7DA6; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#2C4766; --navy-2:#3A5A80; --copper:#D08A52; --copper-ink:#E8A877; --copper-soft:#3A2A1D;
  --bg:#0F151D; --surface:#17202B; --surface-2:#1C2733; --line:#2B3746; --line-2:#222D3A;
  --fg:#E8E4DD; --muted:#9AA3AF; --faint:#6E7884;
  --ok:#55B387; --ok-soft:#163226; --warn:#E3AA45; --warn-soft:#3A2D14; --bad:#E5705F; --bad-soft:#3D1E1A;
  --rail:#0B1118; --rail-fg:#A9B5C3; --rail-hover:#16212E; --bar:#5B7DA6; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:12px 40px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.right{margin-left:auto}

/* barra superior */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1440px;margin:0 auto 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.surfaces{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;max-width:100%}
.surfaces button{border:0;background:transparent;padding:8px 12px;border-radius:9px;white-space:nowrap;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center}
.surfaces button[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;position:relative}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px}
.who select{border:0;background:transparent;font-weight:600;max-width:210px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--copper-soft);color:var(--copper-ink);display:grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.bell{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.bell .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--copper);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.themebtn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:600;font-size:13px;color:var(--muted)}
.drop{position:absolute;top:46px;right:0;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.drop header{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
.nitem{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--copper-soft)}
.nitem .t{font-size:11.5px;color:var(--muted)}

/* botones y chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--navy);color:var(--on-navy);padding:9px 14px;border-radius:10px;font-weight:600;white-space:nowrap;min-height:38px}
.btn:hover{filter:brightness(1.08)}
.btn.copper{background:var(--copper);color:var(--on-copper)}
.btn.okb{background:var(--ok);color:#fff}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;min-height:26px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.cu{background:var(--copper-soft);color:var(--copper-ink)}
.pill.navy{background:var(--navy);color:#fff}
.pill.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.newtag{font-size:10.5px;font-weight:700;background:var(--copper);color:#fff;border-radius:5px;padding:1px 5px;margin-left:auto}

/* campos */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
.in:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.in.sm{min-height:32px;padding:5px 8px}
.searchbox{position:relative}
.searchbox .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbox .in{padding-left:34px}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.toggle{position:relative;width:40px;height:23px;flex:none;display:inline-block}
.toggle input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.toggle span::after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--ok)}
.toggle input:checked+span::after{transform:translateX(17px)}
.toggle input:focus-visible+span{outline:2px solid var(--copper);outline-offset:2px}

/* ventana escritorio */
.win{max-width:1440px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:228px minmax(0,1fr);min-height:820px}
.rail{background:var(--rail);color:var(--rail-fg);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.rail .rest{font-size:12px;padding:4px 10px 14px;color:#8B9BAE}
.rail .rest b{display:block;color:#fff;font-family:var(--f-display);font-size:15px}
.navb{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:inherit;padding:8px 10px;border-radius:9px;font-weight:600;text-align:left;width:100%}
.navb:hover{background:var(--rail-hover);color:#fff}
.navb[aria-current="page"]{background:#fff;color:#1B2B3F}
.navb .cnt{margin-left:auto;background:var(--copper);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.navb[aria-current="page"] .cnt{background:#1B2B3F}
.navb .newtag+.cnt{margin-left:4px}
.rail .me{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.rail .me b{color:#fff;display:block;font-size:13px}
.work{padding:22px 26px 30px;min-width:0;background:var(--bg)}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .sub{color:var(--muted);margin-top:4px;max-width:64ch}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel .body{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:22px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert .v{color:var(--bad)}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.low td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.bar{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar.low i{background:var(--bad)}
.bar.mid i{background:var(--warn)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

/* mesas y órdenes */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mesa{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;min-height:74px;display:flex;flex-direction:column;gap:2px}
.mesa b{font-family:var(--f-display);font-size:18px}
.mesa .sm{color:var(--muted)}
.mesa.busy{border-style:solid;border-color:var(--navy);background:var(--navy);color:#fff}
.mesa.busy .sm{color:#C3CEDB}
.mesa.bill{border-style:solid;border-color:var(--copper);background:var(--copper);color:#fff}
.mesa.bill .sm{color:#FBE6D5}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ocard .mt{font-family:var(--f-display);font-size:19px;font-weight:700}
.ocard .items{font-size:13px;color:var(--muted);line-height:1.5}

/* POS */
.pos{display:grid;grid-template-columns:200px minmax(0,1fr) 350px;gap:14px;align-items:start}
.olist{display:flex;flex-direction:column;gap:6px}
.olist button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;text-align:left;display:flex;flex-direction:column;gap:1px}
.olist button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.olist b{font-family:var(--f-display)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dish{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.dish:hover{border-color:var(--copper)}
.dish b{font-weight:600;line-height:1.25}
.dish .p{font-family:var(--f-display);font-weight:700;margin-top:auto}
.dish[disabled]{opacity:.5;cursor:not-allowed}
.ticket{position:sticky;top:12px}
.tline{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tline .q{font-weight:700;min-width:22px}
.tline .nm{flex:1;min-width:0}
.tline .nt{font-size:12px;color:var(--copper-ink)}
.tline.cancel .nm{text-decoration:line-through;color:var(--faint)}
.tot{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.tot.disc{color:var(--ok);font-weight:600}
.tot.big{font-family:var(--f-display);font-size:22px;font-weight:700;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.hist{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.hist div{position:relative}
.hist div::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--copper)}

/* ticket impreso */
.receipt{font-family:var(--f-mono);font-size:12.5px;background:#FFFDF8;color:#1F2328;border:1px solid #E6E0D3;border-radius:4px;padding:18px 18px 22px;max-width:360px;box-shadow:var(--shadow);position:relative}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;background:linear-gradient(-45deg,transparent 4px,#FFFDF8 0) 0 0/10px 8px,linear-gradient(45deg,transparent 4px,#FFFDF8 0) 0 0/10px 8px}
.receipt .c{text-align:center}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed #B9B2A3;margin:8px 0}
.receipt b{font-weight:600}
.receipt .qr{display:flex;gap:10px;align-items:center;margin-top:6px}
.receipt .qr svg{flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(14,20,27,.48);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line)}
.modal.wide{width:min(780px,100%)}
.modal>header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.paybig{font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em}
.change{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.change b{font-family:var(--f-display);font-size:26px}
.change.short{background:var(--bad-soft);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.denom{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.denom span{min-width:56px;font-weight:600}
.denom .in{min-height:32px;padding:4px 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:700}
.pick button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.callout{background:var(--surface-2);border:1px solid var(--line-2);padding:10px 12px;border-radius:10px;font-size:13px}
.callout.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* toasts */
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:min(480px,calc(100vw - 32px))}
.toast{background:#1B2B3F;color:#fff;padding:11px 14px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;animation:tin .22s ease-out}
.toast .ic{color:#E9A673;margin-top:1px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* configuración */
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.ctabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ctabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--copper)}
.taxcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:18px;height:18px;accent-color:var(--ok)}
.days{display:flex;gap:4px}
.days button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* pedidos en línea */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.kcol>h3{display:flex;align-items:center;gap:8px;padding:2px 4px}

function totales(o,extra){
 const its=extra||vivos(o);
 const L=its.map(it=>({it,p:pl(it.p),gross:unit(it)*it.cant,disc:0}));
 const desc=[];
 S.promos.filter(promoActiva).forEach(pr=>{let tot=0;
  if(pr.tipo==='2x1'){const units=[];L.forEach((l,k)=>{if(pr.productos.includes(l.p.id))for(let j=0;j<l.it.cant;j++)units.push(k)});const free=Math.floor(units.length/2);for(let j=0;j<free;j++){const l=L[units[units.length-1-j]];l.disc+=l.p.precio;tot+=l.p.precio}}
  else if(pr.tipo==='pct'){L.forEach(l=>{if(l.p.cat===pr.cat){const d=(l.gross-l.disc)*pr.pct/100;l.disc+=d;tot+=d}})}
  if(tot>0.001)desc.push({nombre:pr.nombre,monto:tot});
 });
 if(o&&o.descuento){let tot=0;L.forEach(l=>{const d=(l.gross-l.disc)*o.descuento.pct/100;l.disc+=d;tot+=d});desc.push({nombre:`Descuento ${o.descuento.pct}%, ${o.descuento.motivo.toLowerCase()}`,monto:tot,manual:true})}
 const tx={};let base=0,total=0,bruto=0;S.impuestos.filter(t=>t.activo).forEach(t=>tx[t.id]=0);
 L.forEach(l=>{bruto+=l.gross;const amt=l.gross-l.disc;
  const ap=S.impuestos.filter(t=>t.activo&&(t.alcance==='cuenta'||t.productos.includes(l.p.id)));const r=ap.reduce((a,t)=>a+t.tasa,0);
  const b=S.config.preciosIncluyen?amt/(1+r/100):amt;ap.forEach(t=>tx[t.id]+=b*t.tasa/100);base+=b;total+=b*(1+r/100)});
 return {bruto,descuentos:desc,descTotal:desc.reduce((s,d)=>s+d.monto,0),base,total,taxes:S.impuestos.filter(t=>t.activo).map(t=>({nombre:`${t.nombre} ${t.tasa}%`,monto:tx[t.id]}))};
}

 rec.forEach(r=>{const i=ins(r.i);const was=low(i);i.stock=r3(Math.max(0,i.stock+sign*r.q*cant*(1+mermaOf(i)/100)));

function bars(data,fmt,hl){const mx=Math.max(...data.map(d=>d.v),1);const imax=data.findIndex(d=>d.v===mx);
 return `<div class="bars">${data.map((d,k)=>`<div class="b ${hl===k?'hl':''}" tabindex="0" aria-label="${esc(d.l)}: ${fmt(d.v)}"><span class="tip">${esc(d.l)}: ${fmt(d.v)}</span>${k===imax||k===hl?`<span class="v" style="bottom:${d.v/mx*100}%">${fmt(d.v)}</span>`:''}<i style="height:${d.v/mx*100}%"></i></div>`).join('')}</div><div class="xlab">${data.map(d=>`<span>${esc(d.x||d.l)}</span>`).join('')}</div>`}
function hbars(data,fmt){const mx=Math.max(...data.map(d=>d.v),1);return `<div class="hbars">${data.map(d=>`<div class="hb"><span>${d.l}</span><div class="tr"><i style="width:${d.v/mx*100}%"></i></div><span class="val">${fmt(d.v)}</span></div>`).join('')}</div>`}
function modRep(){
 const r=resumen(0);const hoy=r.ventas;
 const semana=[26840,31120,28950,33470,41280,46910].map((v,k)=>{const d=new Date(T0-(6-k)*86400000);return {l:d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric'}),x:d.toLocaleDateString('es-MX',{weekday:'short'}),v}});semana.push({l:'Hoy (en curso)',x:'Hoy',v:hoy});
 const horas={};S.caja.movs.filter(x=>x.tipo==='venta').forEach(x=>{const h=new Date(x.ts).getHours();horas[h]=(horas[h]||0)+x.monto});
 const hk=Object.keys(horas).map(Number).sort((a,b)=>a-b);const hd=[];if(hk.length)for(let h=hk[0];h<=hk[hk.length-1];h++)hd.push({l:`${h}:00 a ${h+1}:00`,x:`${h}h`,v:horas[h]||0});
 const canal=Object.entries(r.porCanal).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:canalTag(k),v}));
 const vend={};S.ordenes.filter(o=>o.estado==='pagada').forEach(o=>vivos(o).forEach(i=>vend[i.p]=(vend[i.p]||0)+i.cant));
 const filas=S.platillos.map(p=>{const n=vend[p.id]||0;const ut=(p.precio/1.16-costoPl(p))*n;return {p,n,ut,mg:(p.precio/1.16-costoPl(p))/(p.precio/1.16)*100}}).sort((a,b)=>b.n-a.n);
 const utilidad=filas.reduce((s,f)=>s+f.ut,0);const tc=tiempoCocina();
 const sem=semana.reduce((s,d)=>s+d.v,0);
 const catalogo=['Ventas por día','Ventas por hora','Ventas por canal','Ventas por mesero','Productos más y menos vendidos','Costo y utilidad por platillo','Descuentos otorgados','Cancelaciones','Propinas','Consumo teórico vs real','Compras por proveedor','Movimientos de inventario','Mermas','Facturas emitidas','Cortes de caja'];
 return head('Reportes','Ventas, costos y operación en tiempo real. Se puede abrir desde el celular del dueño.',`<button class="btn ghost" data-a="exportRep">${ic('print',16)}Exportar a Excel</button>`)+
 `<div class="kpis"><div class="kpi"><div class="l">Ventas últimos 7 días</div><div class="v">${m(sem)}</div><div class="d">+8.4% contra la semana anterior</div></div><div class="kpi"><div class="l">Ticket promedio hoy</div><div class="v">${m(r.promedio)}</div></div><div class="kpi"><div class="l">Utilidad bruta hoy</div><div class="v">${m(utilidad)}</div><div class="d">Precio sin IVA menos costo de receta</div></div><div class="kpi"><div class="l">Tiempo promedio en cocina</div><div class="v">${Math.round(tc)} min</div></div></div>
 <div class="twocol" style="margin-bottom:14px"><div class="panel"><header><h3>Ventas por día</h3><span class="sm muted right">Pasa el mouse por las barras</span></header><div class="body">${bars(semana,v=>m(v).replace('.00',''),6)}</div></div>
 <div class="panel"><header><h3>Ventas de hoy por hora</h3></header><div class="body">${hd.length?bars(hd,v=>m(v).replace('.00','')):'<div class="empty">Sin ventas hoy.</div>'}</div></div></div>
 <div class="twocol" style="margin-bottom:14px"><div class="panel"><header><h3>Ventas de hoy por canal</h3></header><div class="body">${hbars(canal,v=>m(v).replace('.00',''))}</div></div>
 <div class="panel"><header><h3>Ventas de hoy por mesero</h3></header><div class="body">${hbars(Object.entries(r.porMesero).sort((a,b)=>b[1]-a[1]).map(([u,v])=>({l:esc(usr(u).nombre),v})),v=>m(v).replace('.00',''))}</div></div></div>
 <div class="panel" style="margin-bottom:14px"><header><h3>Platillos de hoy: más y menos vendidos</h3></header><div class="tblwrap"><table class="tbl"><thead><tr><th>Platillo</th><th class="r">Vendidos</th><th class="r">Margen</th><th class="r">Utilidad</th><th></th></tr></thead><tbody>
 ${filas.map((f,k)=>`<tr><td><b>${esc(f.p.nombre)}</b> <span class="sm muted">${esc(f.p.cat)}</span></td><td class="r">${f.n}</td><td class="r">${Math.round(f.mg)}%</td><td class="r">${m(f.ut)}</td><td>${k<3&&f.n?'<span class="pill ok">Top</span>':f.n===0?'<span class="pill warn">Sin ventas</span>':''}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="panel"><header><h3>Más reportes</h3></header><div class="body chips">${catalogo.map(c=>`<button class="chip" data-a="repOpen" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`;
}

function compras(){

   ${res.map(i=>{const on=C.draft[i.id];const pend=enLista(i.id);return `<div class="need"><div class="nm"><b>${esc(i.nombre)}</b><span class="sm muted">Hay ${qty(i.stock,i.unidad)}</span></div>${pend?'<span class="pill ok">Ya pedido</span>':`<button class="addbtn ${on?'on':''}" data-a="chefToggle" data-id="${i.id}">${on?ic('check',16)+'Listo':ic('plus',16)+'Agregar'}</button>`}</div>`}).join('')}`;
  }else{
   body=mine.length?mine.map(c=>{const i=ins(c.insumo);return `<div class="need"><div class="nm"><b>${esc(i.nombre)}, ${qty(c.cant,i.unidad)}</b><span class="sm muted">Pedido ${fecha(c.ts)} ${hhmm(c.ts)}${c.estado==='comprado'?`, comprado por ${esc(usr(c.compro).nombre.split(' ')[0])} a las ${hhmm(c.tsCompra)}`:''}</span></div>${c.estado==='comprado'?'<span class="pill ok">Comprado</span>':'<span class="pill warn">Pendiente</span>'}</div>`}).join(''):'<div class="empty">Aún no pides nada.</div>';
  }
  scr=`<div class="ahead" style="flex-direction:column;align-items:stretch">${seg}</div><div class="ascroll" data-keep="chef">${body}</div>

  <div class="afoot"><button class="pbtn navy" data-a="buyFinish" ${done.length?'':'disabled'}>${ic('check',18)}Terminé las compras</button></div>`;
  if(C.sheet){const c=S.compras.find(x=>x.id===C.sheet.id);const i=ins(c.insumo);
   scr+=`<div class="sheet"><div class="in-s"><div><h2>${esc(i.nombre)}</h2><span class="sm muted">Pidieron ${qty(c.cant,i.unidad)}. ¿Cuánto compraste?</span></div>
   <div class="bigstep"><button data-a="buyQ" data-s="-1" aria-label="Menos">${ic('minus',22)}</button><span class="v">${qty(C.sheet.cant,i.unidad)}</span><button data-a="buyQ" data-s="1" aria-label="Más">${ic('plus',22)}</button></div>
   <div class="field"><label for="buyP">Cuánto pagaste (opcional)</label><input id="buyP" class="in" style="min-height:48px;font-size:17px;border-radius:12px" inputmode="decimal" type="number" placeholder="$0.00" value="${C.sheet.precio}" data-in="buyP"></div>
   <button class="pbtn" style="background:var(--ok)" data-a="buyConfirm">${ic('check',18)}Listo, lo compré</button><button class="pbtn ghost" style="min-height:44px" data-a="buyClose">Cancelar</button></div></div>`}
 }
 return `<div class="phone" aria-label="Celular de chef y compras"><div class="screen">${sbar()}${banner(uid)}${scr}</div></div>`;
}

 else if(C.screen==='menu'){

function statusSteps(L,en){

 if(L.orden){st=Math.max(st,1);const o=ord(L.orden);if(o){if(!vivos(o).some(i=>i.estado==='pendiente'))st=2;if(o.estado==='pagada')st=3}}
 if(st<0)return `<div><span>${ic('x',14)}</span>${en?'The restaurant could not take your order':'El restaurante no pudo tomar tu pedido'}</div>`;
 const labels=en?['Received','In the kitchen','Ready','Delivered']:['Recibido','En cocina','Listo','Entregado'];
 return labels.map((l,k)=>`<div class="${k<=st?'on':''}"><span>${k<=st?ic('check',13):''}</span>${l}</div>`).join('');

 const html=cards.map(({o,its,pend,old})=>{const mn=mins(old);const cls=mn>=20?'late':mn>=10?'mid':'';const fresh=K.fresh[o.id]&&Date.now()-K.fresh[o.id]<5000;

  <div class="kmeta"><span class="kch ${esMesa(o)?'':'del'}">${CANAL[o.canal].n}</span>${esc(o.mesero?usr(o.mesero).nombre:(o.etiqueta||'').split(', ')[1]||'')}${o.listoEn?`, prometido ${o.listoEn} min`:''}</div>
  ${its.map(i=>{const p=pl(i.p);return `<button class="kit ${i.estado==='despachado'?'done':''}" data-a="kItem" data-o="${o.id}" data-i="${i.id}"><span class="q">${i.cant}</span><span class="n">${esc(p.nombre)}${p.tipo?`<span class="comp">${p.componentes.map(c=>`${c.cant*i.cant} ${esc(pl(c.p).nombre)}`).join(', ')}</span>`:''}${(i.extras||[]).map(x=>`<span class="nota">+ ${esc(ex(x).nombre)}</span>`).join('')}${i.nota?`<span class="nota">${esc(i.nota)}</span>`:''}</span><span class="st">${i.estado==='despachado'?'Listo':f==='todas'?esc(est(p.estacion).nombre):hhmm(i.enviado)}</span></button>`}).join('')}
  <footer><button class="kbtn" data-a="kAll" data-o="${o.id}">Despachar comanda</button><button class="kbtn alt" data-a="kPrint" data-o="${o.id}" aria-label="Reimprimir">${ic('print',18)}</button></footer></article>`}).join('');
 const counts={todas:0};S.estaciones.forEach(e=>counts[e.id]=0);abiertas().forEach(o=>vivos(o).filter(i=>i.estado==='pendiente').forEach(i=>{counts.todas+=i.cant;counts[pl(i.p).estacion]+=i.cant}));

 <div class="kstat"><span>Tiempo promedio hoy <b>${Math.round(tiempoCocina())} min</b></span><span>Comandas abiertas <b>${cards.length}</b></span><span>Con más de 20 min <b style="color:${atras?'#FF9C8C':'#fff'}">${atras}</b></span><span>Toca un platillo para marcarlo listo o despacha la comanda entera. El mesero o caja reciben aviso.</span></div>
 <div class="kgrid">${html||'<div class="kempty"><b>Sin comandas pendientes</b>Las nuevas aparecen aquí en cuanto el mesero las envía.</div>'}</div>

}

 notify({user:c.pidio},`${usr(u).nombre.split(' ')[0]} compró ${qty(cant,i.unidad)} de ${i.nombre}`,{surface:'compras',modo:'chef'});
 toast(`${i.nombre} sumado al inventario. ${usr(c.pidio).nombre.split(' ')[0]} recibió aviso.`)}
function despachoAviso(o,its){if(!its.length)return;const det=its.map(itemTxt).join(', ');
 o.hist.push({ts:Date.now(),u:'u5',acc:`Cocina despachó ${det}`});log('Cocina',`Despachado ${mesaLabel(o)} #${o.id}`,det,'u5');
 if(o.mesero)notify({user:o.mesero},`${mesaLabel(o)}: ya salió ${det}`,{surface:'mesero',orden:o.id});
 else if(!vivos(o).some(i=>i.estado==='pendiente'))notify({rol:'r3'},`${mesaLabel(o)} listo para entregar`,{surface:'desk',mod:'enlinea'});
 S.kds.recientes.unshift({o:o.id,ids:its.map(i=>i.id),label:`${esMesa(o)?mesaLabel(o):CANAL[o.canal].n} (${its.length})`,ts:Date.now()});
 toast(`${mesaLabel(o)}: ${det}. ${o.mesero?usr(o.mesero).nombre.split(' ')[0]+' recibió aviso en su celular.':'Caja recibió aviso para entregar.'}`,'bell')}

 nuN:v=>{S.modal.nombre=v;return 'quiet'},nuP:v=>{S.modal.pin=v.replace(/\D/g,'').slice(0,4);return 'quiet'},nrN:v=>{S.modal.nombre=v;return 'quiet'},
 rtM:v=>{S.modal.monto=v;return 'quiet'},den:(v,t)=>{S.modal.c[t.dataset.k]=v},zF:v=>{S.modal.fondo=v;return 'quiet'},
 fRfc:v=>{S.modal.rfc=v;return 'quiet'},fCp:v=>{S.modal.cp=v;return 'quiet'},fNom:v=>{S.modal.nombre=v;return 'quiet'},fMail:v=>{S.modal.correo=v;return 'quiet'},
 npN:v=>{S.modal.nombre=v;return 'quiet'},npP:v=>{S.modal.pct=v;return 'quiet'},npD:v=>{S.modal.desde=v;return 'quiet'},npH:v=>{S.modal.hasta=v;return 'quiet'},
 cliN:v=>{S.cli.nombre=v;return 'quiet'},cliD:v=>{S.cli.dir=v;return 'quiet'},cliT:v=>{S.cli.tel=v;return 'quiet'},

const CH={

 mSetSel:(v,t)=>{S.modal[t.dataset.k]=v;if(t.dataset.k==='rol'||t.dataset.k==='copia'||t.dataset.k==='cat')return;return 'quiet'},
 invAlm:v=>{S.inv.f=v},
 recIns:(v,t)=>{const p=pl(S.rec.sel);const prev=ins(p.receta[+t.dataset.k].i).nombre;p.receta[+t.dataset.k].i=v;log('Recetas','Cambió ingrediente',`${p.nombre}: ${prev} por ${ins(v).nombre}`)},
 recQ:(v,t)=>{const p=pl(S.rec.sel);const r=p.receta[+t.dataset.k];const prev=r.q;r.q=Math.max(0,+v||0);log('Recetas','Cambió cantidad',`${p.nombre}, ${ins(r.i).nombre}: de ${prev} a ${r.q} ${ins(r.i).unidad}`)},
 pkQ:(v,t)=>{const p=pl(S.rec.sel);const c=p.componentes[+t.dataset.k];c.cant=Math.max(1,parseInt(v)||1);log('Recetas','Cambió paquete',`${p.nombre}: ${c.cant} ${pl(c.p).nombre}`)},
 recPrice:v=>{const p=pl(S.rec.sel);const prev=p.precio;p.precio=Math.max(0,+v||0);log('Recetas','Cambió precio',`${p.nombre}: de ${m(prev)} a ${m(p.precio)}`)},
 recEst:v=>{const p=pl(S.rec.sel);p.estacion=v;log('Recetas','Cambió estación',`${p.nombre}: ${est(v).nombre}`)},
 promoAct:(v,t)=>{const pr=S.promos.find(x=>x.id===t.dataset.id);pr.activo=t.checked;log('Promociones',t.checked?'Activó promoción':'Apagó promoción',pr.nombre)},
 promoDesde:(v,t)=>{const pr=S.promos.find(x=>x.id===t.dataset.id);pr.desde=v||pr.desde;log('Promociones','Cambió horario',`${pr.nombre}: ${pr.desde} a ${pr.hasta}`)},
 promoHasta:(v,t)=>{const pr=S.promos.find(x=>x.id===t.dataset.id);pr.hasta=v||pr.hasta;log('Promociones','Cambió horario',`${pr.nombre}: ${pr.desde} a ${pr.hasta}`)},
 promoPct:(v,t)=>{const pr=S.promos.find(x=>x.id===t.dataset.id);pr.pct=Math.min(100,Math.max(0,+v||0));log('Promociones','Cambió porcentaje',`${pr.nombre}: ${pr.pct}%`)},
 canalOn:(v,t)=>{S.canales[t.dataset.k]=t.checked;log('Pedidos en línea',t.checked?'Reanudó canal':'Pausó canal',CANAL[t.dataset.k].n);toast(t.checked?`${CANAL[t.dataset.k].n} vuelve a recibir pedidos.`:`${CANAL[t.dataset.k].n} en pausa: tus clientes ven que la cocina está llena.`)},
 userRol:(v,t)=>{const u=usr(t.dataset.id);const prev=rol(u.rol).nombre;u.rol=v;log('Usuarios','Cambió rol',`${u.nombre}: de ${prev} a ${rol(v).nombre}`);toast(`${u.nombre} ahora es ${rol(v).nombre}.`)},
 userAct:(v,t)=>{const u=usr(t.dataset.id);u.activo=t.checked;log('Usuarios',t.checked?'Activó usuario':'Desactivó usuario',u.nombre)},
 perm:(v,t)=>{const r=rol(t.dataset.r);const p=t.dataset.p;r.perms=t.checked?[...r.perms,p]:r.perms.filter(x=>x!==p);log('Usuarios','Cambió permiso',`${r.nombre}: ${t.checked?'puede':'ya no puede'} ${PERMS.find(x=>x[0]===p)[1].toLowerCase()}`)},
 cfgInc:(v,t)=>{S.config.preciosIncluyen=t.checked;log('Configuración','Precios con impuestos',t.checked?'Incluidos':'Se suman al cobrar')},
 taxAct:(v,t)=>{const x=S.impuestos.find(y=>y.id===t.dataset.id);x.activo=t.checked;log('Configuración',t.checked?'Activó impuesto':'Desactivó impuesto',x.nombre)},
 taxName:(v,t)=>{const x=S.impuestos.find(y=>y.id===t.dataset.id);const prev=x.nombre;x.nombre=v.trim()||prev;log('Configuración','Renombró impuesto',`${prev} a ${x.nombre}`)},
 taxRate:(v,t)=>{const x=S.impuestos.find(y=>y.id===t.dataset.id);const prev=x.tasa;x.tasa=Math.max(0,+v||0);log('Configuración','Cambió tasa',`${x.nombre}: de ${prev}% a ${x.tasa}%`)},
 mermaG:v=>{const prev=S.config.mermaGlobal;S.config.mermaGlobal=+v;log('Configuración','Cambió merma general',`De ${prev}% a ${v}%`)},
 mermaI:(v,t)=>{const i=ins(t.dataset.id);const prev=mermaOf(i);i.merma=v===''?null:Math.max(0,+v);log('Configuración',`Cambió merma de ${i.nombre}`,`De ${prev}% a ${mermaOf(i)}%`)},
 propAct:(v,t)=>{const p=S.props.find(x=>x.id===t.dataset.id);p.activo=t.checked;log('Configuración',t.checked?'Mostrar propiedad':'Ocultar propiedad',p.nombre)},
 cfgImp:(v,t)=>{S.config.imprimir=t.checked;log('Configuración','Impresión de comandas',t.checked?'Encendida':'Apagada')},
 cfgKds:(v,t)=>{S.config.kds=t.checked;log('Configuración','Pantalla de cocina',t.checked?'Encendida':'Apagada')},
 cfgName:v=>{S.config.restaurante=v.trim()||S.config.restaurante;log('Configuración','Nombre del restaurante',S.config.restaurante)},
 cfgSuc:v=>{S.config.sucursal=v.trim()||S.config.sucursal},
 cfgMesas:v=>{S.config.mesas=Math.min(40,Math.max(1,+v||12));log('Configuración','Número de mesas',String(S.config.mesas))},
 cfgFondo:v=>{S.caja.turno.fondo=Math.max(0,+v||0)},
 segR:v=>{S.seg.reimpLibres=Math.max(0,parseInt(v)||0);log('Seguridad','Cambió regla','Impresiones sin autorización: '+S.seg.reimpLibres)},
 segD:v=>{S.seg.descAlerta=Math.max(0,+v||0);log('Seguridad','Cambió regla',`Alerta de descuento mayor a ${S.seg.descAlerta}%`)},
 segC:v=>{S.seg.cancAlerta=Math.max(0,parseInt(v)||0);log('Seguridad','Cambió regla',`Alerta con más de ${S.seg.cancAlerta} cancelaciones`)},
 segCD:(v,t)=>{S.seg.cancDespachado=t.checked;log('Seguridad','Cambió regla',`Avisar cancelaciones ya servidas: ${t.checked?'sí':'no'}`)},

 segTel:v=>{S.seg.tel=v.trim();log('Caja','Cambió WhatsApp para cortes',S.seg.tel)},
 segMail:v=>{S.seg.correo=v.trim();log('Caja','Cambió correo para cortes',S.seg.correo)},
 audM:v=>{S.aud.mod=v},audU:v=>{S.aud.user=v},
 mesUser:v=>{S.mes.user=v;S.mes.screen='mesas';S.mes.draft=[]}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(S.bellOpen&&!e.target.closest('.drop')){S.bellOpen=false;render()}return}if(t.disabled)return;const f=A[t.dataset.a];if(!f)return;const r=f(t.dataset,t,e);if(r!=='skip')render()});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.in)return;const r=IN[t.dataset.in]?.(t.value,t);if(r!=='quiet')render()});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.ch)return;const r=CH[t.dataset.ch]?.(t.value,t);if(r!=='quiet')render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;pendingAuth=null;render()}if(e.key==='Enter'&&S.modal&&S.modal.type==='auth'&&e.target.id==='authPin'){A.mAuth();render()}});
setInterval(()=>{const a=document.activeElement;if(S.modal||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;render()},20000);
applyTheme();render();
</script>
